<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Ground Shadow -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1b1b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1c1b1b" stop-opacity="0"/>
    </radialGradient>

    <!-- Cardboard Box Gradients -->
    <!-- Top Face (light source from top-left) -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed8bb"/>
      <stop offset="100%" stop-color="#dcb689"/>
    </linearGradient>

    <!-- Left Face (medium shadow) -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cca376"/>
      <stop offset="100%" stop-color="#b08b5f"/>
    </linearGradient>

    <!-- Right Face (dark shadow) -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#af875b"/>
      <stop offset="100%" stop-color="#916c43"/>
    </linearGradient>

    <!-- Red Price Tag Gradient (vibrant brand red) -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#9e0000"/>
    </linearGradient>
  </defs>

  <!-- Soft Ground Shadow -->
  <ellipse cx="50" cy="83" rx="30" ry="7" fill="url(#shadowGrad)"/>

  <!-- Cardboard Box Body -->
  <!-- Left Face -->
  <path d="M20 35 L50 50 L50 80 L20 65 Z" fill="url(#leftFaceGrad)"/>

  <!-- Right Face -->
  <path d="M50 50 L80 35 L80 65 L50 80 Z" fill="url(#rightFaceGrad)"/>

  <!-- Top Face -->
  <path d="M50 20 L80 35 L50 50 L20 35 Z" fill="url(#topFaceGrad)"/>

  <!-- Shipping Label on Left Face -->
  <path d="M30 46 L42 52 L42 61 L30 55 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Barcode lines on label -->
  <line x1="32" y1="49" x2="40" y2="53" stroke="#8b5a2b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="52" x2="37" y2="54.5" stroke="#8b5a2b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="55" x2="40" y2="59" stroke="#8b5a2b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Packing Tape (Dark Brown) -->
  <!-- Top Face Seam (Vertical line) -->
  <path d="M47 21.5 L53 18.5 L53 48.5 L47 51.5 Z" fill="#755231" opacity="0.85"/>
  <!-- Front Vertical Edge Tape segment -->
  <path d="M47 51.5 L53 48.5 L53 60 L47 60 Z" fill="#604123" opacity="0.85"/>

  <!-- Price Tag String / Thread -->
  <path d="M50 42 Q55 40 60 48" fill="none" stroke="#755231" stroke-width="2" stroke-linecap="round"/>

  <!-- Red Price Tag with White Dollar Mark -->
  <g transform="translate(60, 48) rotate(28)">
    <!-- Tag Shape -->
    <path d="M 0 0 L 8 -8 L 34 -8 C 37 -8, 39 -6, 39 -3 L 39 3 C 39 6, 37 8, 34 8 L 8 8 Z" fill="url(#tagGrad)" filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.15))"/>
    
    <!-- Grommet hole (Metal frame for premium feel) -->
    <circle cx="7" cy="0" r="3" fill="#d1d5db"/>
    <circle cx="7" cy="0" r="1.5" fill="#a07548"/>
    
    <!-- White Dollar Mark -->
    <text x="23" y="4.5" fill="#ffffff" font-size="13" font-family="Chivo, Inter, sans-serif" font-weight="900" text-anchor="middle">$</text>
  </g>
</svg>
